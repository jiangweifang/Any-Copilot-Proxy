[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-proxy"
version = "0.1.0"
description = "Local multi-channel AI gateway (GitHub Copilot, M365 Copilot, Google Antigravity) with desktop UI and headless CLI"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14,<4", "aiohttp-socks>=0.10,<1", "jsonschema>=4.25,<5"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.9,<7"]
benchmark = ["tiktoken>=0.12,<1"]

[project.scripts]
copilot-proxy = "copilot_proxy.cli:main"
copilot-proxy-native = "copilot_proxy.m365_copilot.native_host:main"

[project.gui-scripts]
copilot-proxy-desktop = "copilot_proxy.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
